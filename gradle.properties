# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# YouTube Data API v3 key
# ---------------------------------------------------------------------------
# The recommended place for your key is local.properties (never committed):
#
#   YOUTUBE_API_KEY=AIza...your key...
#
# You may also set it here, or export it as an environment variable.
# Any of the three works - local.properties wins.
# YOUTUBE_API_KEY=

# Default content region (IN, US, GB, CA, AU, DE, JP, BR ...)
VIDORA_REGION=IN

# ---------------------------------------------------------------------------
# Release signing (all optional - the release build falls back to the debug key
# when these are absent). Keystore path is relative to the project root.
# ---------------------------------------------------------------------------
# RELEASE_KEYSTORE_PATH=release.keystore
# RELEASE_KEYSTORE_PASSWORD=changeit
# RELEASE_KEY_ALIAS=vidora
# RELEASE_KEY_PASSWORD=changeit
