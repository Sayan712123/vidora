name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which variant to build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: read

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    # Secrets are exposed as environment variables here because GitHub does not
    # allow `secrets.*` to be referenced directly inside an `if:` expression.
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore the release keystore
        # Only runs when the signing secrets are present. Without them the release
        # build is signed with the debug key, so the workflow still produces an
        # installable APK.
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Release keystore restored."

      - name: Write local.properties
        # The API key is injected from a repository secret. If the secret is not set
        # the app still builds; it simply shows the "API key missing" notice at runtime.
        run: |
          {
            echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY}"
            echo "VIDORA_REGION=IN"
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "RELEASE_KEYSTORE_PATH=release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${KEY_PASSWORD}"
            fi
          } > local.properties
          echo "local.properties written (values are not printed)."

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: vidora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: vidora-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove the keystore and local.properties
        if: always()
        run: |
          rm -f release.keystore local.properties
